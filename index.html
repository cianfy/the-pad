<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pad — Bacheca Interattiva Online</title>
  <meta name="description" content="Una bacheca stile Padlet moderna ed interattiva per condividere testo ed immagini online in tempo reale su GitHub Pages con Supabase.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Ambient Animated Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="app">
    <!-- Navigation Header -->
    <header class="app-header">
      <div class="header-container">
        
        <!-- Logo -->
        <div class="logo-section">
          <div class="logo-badge">📌</div>
          <div>
            <div class="logo-title">The Pad</div>
            <div class="logo-subtitle">Interactive Board</div>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="search-filter-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Cerca tra i post per testo, autore o tag...">
        </div>

        <!-- Header Actions -->
        <div class="header-actions">
          <!-- View Modes -->
          <div class="btn-group" title="Cambia Modalità Vista">
            <button id="viewGridBtn" class="btn-icon active" title="Griglia Dinamica">
              <span>📐</span> <span class="hide-mobile">Griglia</span>
            </button>
            <button id="viewCanvasBtn" class="btn-icon" title="Bacheca Libera Drag & Drop">
              <span>🖐️</span> <span class="hide-mobile">Libera</span>
            </button>
            <button id="viewListBtn" class="btn-icon" title="Vista Lista">
              <span>☰</span> <span class="hide-mobile">Lista</span>
            </button>
          </div>

          <!-- Dark/Light Theme Toggle -->
          <button id="themeToggleBtn" class="btn-icon" title="Cambia Tema">
            <span id="themeIcon">🌙</span>
          </button>

          <!-- Add Post Button -->
          <button id="openPostModalBtn" class="btn-primary">
            <span>✨</span> <span>Nuovo Post</span>
          </button>
        </div>

      </div>
    </header>

    <!-- Board Info Banner -->
    <div class="board-header">
      <div class="board-info">
        <h1 id="boardTitle">Bacheca della Community</h1>
        <p id="boardDescription">Condividi pensieri, appunti, idee e immagini in tempo reale.</p>
      </div>
      <div id="dbStatusBadge" class="db-status-badge">
        <span class="status-dot"></span>
        <span id="dbStatusText">⚡ Live Cloud Sync (Supabase)</span>
      </div>
    </div>

    <!-- Main Posts Board Area -->
    <main class="main-content">
      <div id="boardContainer" class="board-container grid-view">
        <!-- Posts will be rendered here dynamically -->
      </div>
    </main>

    <!-- Floating Action Button for Mobile/Desktop -->
    <button id="fabBtn" class="fab" title="Crea un nuovo post">
      ➕
    </button>
  </div>

  <!-- Modal 1: Create / Edit Post -->
  <div id="postModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="postModalTitle" class="modal-title">Crea un nuovo Post</h2>
        <button class="btn-close" id="closePostModalBtn">&times;</button>
      </div>
      <form id="postForm">
        <input type="hidden" id="postIdInput">

        <div class="form-group">
          <label class="form-label" for="postTitleInput">Titolo (opzionale)</label>
          <input type="text" id="postTitleInput" class="form-input" placeholder="Es. Una bella idea per la community..." maxlength="100">
        </div>

        <div class="form-group">
          <label class="form-label" for="postContentInput">Contenuto del post *</label>
          <textarea id="postContentInput" class="form-textarea" placeholder="Scrivi qui il tuo messaggio o la tua nota..." required></textarea>
        </div>

        <!-- Image Upload or Link -->
        <div class="form-group">
          <label class="form-label">Immagine (Opzionale)</label>
          <div class="image-upload-box" id="imageDropZone">
            <span style="font-size: 1.5rem;">📸</span>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
              Trascina un'immagine qui o <strong style="color: var(--accent-primary);">sfoglia i file</strong>
            </p>
          </div>
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
          <div style="text-align: center; margin: 0.5rem 0; font-size: 0.75rem; color: var(--text-muted);">OPPUR URL IMMAGINE</div>
          <input type="url" id="imageUrlInput" class="form-input" placeholder="https://esempio.com/immagine.jpg">
          <div id="imagePreviewContainer" class="preview-container" style="display: none;">
            <img id="imagePreview" src="" alt="Anteprima">
            <button type="button" id="removeImageBtn" class="btn-remove-img" title="Rimuovi immagine">&times;</button>
          </div>
        </div>

        <!-- Color Accent Selection -->
        <div class="form-group">
          <label class="form-label">Colore della nota</label>
          <div class="color-picker" id="colorPicker">
            <div class="color-option note-color-purple selected" data-color="purple" style="background: #8b5cf6;" title="Viola"></div>
            <div class="color-option note-color-pink" data-color="pink" style="background: #ec4899;" title="Rosa"></div>
            <div class="color-option note-color-blue" data-color="blue" style="background: #3b82f6;" title="Blu"></div>
            <div class="color-option note-color-teal" data-color="teal" style="background: #14b8a6;" title="Smeraldo"></div>
            <div class="color-option note-color-amber" data-color="amber" style="background: #f59e0b;" title="Ambra"></div>
            <div class="color-option note-color-emerald" data-color="emerald" style="background: #10b981;" title="Verde"></div>
          </div>
        </div>

        <!-- Author & Tag -->
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="postAuthorInput">Tuo Nome / Nickname</label>
            <input type="text" id="postAuthorInput" class="form-input" placeholder="Anonimo" maxlength="30">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="postTagInput">Tag / Categoria</label>
            <input type="text" id="postTagInput" class="form-input" placeholder="Es. Idee, Foto, Memo" maxlength="20">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn-icon" id="cancelPostModalBtn">Annulla</button>
          <button type="submit" class="btn-primary">Pubblica Post 🚀</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Lightbox Image Viewer -->
  <div id="lightboxModal" class="modal-overlay">
    <div class="modal-container lightbox-content" style="max-width: 90vw; background: transparent; border: none; box-shadow: none;">
      <button class="btn-close" id="closeLightboxBtn" style="position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); color: white;">&times;</button>
      <img id="lightboxImage" src="" alt="Ingrandimento">
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Application Modules -->
  <script src="js/db.js" type="module"></script>
  <script src="js/drag.js" type="module"></script>
  <script src="js/app.js" type="module"></script>

</body>
</html>
